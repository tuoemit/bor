# Render blueprint -- "New +" -> "Blueprint" -> pick this repo, OR create the
# Web Service manually and point it at this file.
#
# IMPORTANT: after the service is created, set PANEL_PASSWORD (and optionally
# SESSION_SECRET / API_TOKEN) in the service's Environment tab. `sync: false`
# means Render will not invent a value for the password -- you must provide it.

services:
  - type: web
    name: cloud-browser
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Free instances sleep after ~15 idle minutes; a request (or an external
    # pinger hitting /healthz) wakes them and relaunches Firefox (~10-15 s).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PANEL_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_TOKEN
        sync: false
      - key: MAX_TABS
        value: "3"
      - key: VIEWPORT_WIDTH
        value: "1280"
      - key: VIEWPORT_HEIGHT
        value: "800"
