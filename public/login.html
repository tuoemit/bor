<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Cloud Browser</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%234f7cff'/%3E%3Ccircle cx='50' cy='50' r='20' fill='%230b0f17'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <form class="login-card" id="loginForm" autocomplete="off">
      <div class="login-logo">
        <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true">
          <circle cx="50" cy="50" r="45" fill="#4f7cff" />
          <circle cx="50" cy="50" r="20" fill="#0b0f17" />
        </svg>
      </div>
      <h1>Cloud Browser</h1>
      <p class="muted">Remote Firefox panel · enter the panel password</p>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autofocus required
             placeholder="••••••••••••" />

      <button type="submit" class="btn primary block" id="submitBtn">Unlock panel</button>
      <p class="error" id="loginError" role="alert"></p>
      <p class="muted tiny" id="loginHint"></p>
    </form>
    <script src="/login.js"></script>
  </body>
</html>
