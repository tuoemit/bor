<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Phone Browser</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">Phone Browser</div>
      <div id="status" class="status">Starting…</div>
    </header>

    <section class="controls">
      <form id="navForm" class="address-row">
        <input id="url" autocomplete="off" spellcheck="false" placeholder="https://example.com">
        <button class="primary" type="submit">Go</button>
      </form>
      <div class="toolbar">
        <button data-action="back" aria-label="Back">←</button>
        <button data-action="forward" aria-label="Forward">→</button>
        <button data-action="reload" aria-label="Reload">↻</button>
        <button data-action="home" aria-label="Home">⌂</button>
        <button data-action="scroll_up" aria-label="Scroll up">↑</button>
        <button data-action="scroll_down" aria-label="Scroll down">↓</button>
        <button id="resetBtn" aria-label="Reset browser">Reset</button>
      </div>
    </section>

    <section class="phone-wrap">
      <div class="phone">
        <div class="camera"></div>
        <div class="screen-shell">
          <img id="screen" class="screen" src="/api/screen" alt="Live mobile browser screen">
          <div id="tapLayer" class="tap-layer"></div>
          <div id="loading" class="loading">Loading browser…</div>
        </div>
        <div class="home-bar"></div>
      </div>
    </section>

    <section class="type-panel">
      <input id="text" autocomplete="off" placeholder="Type into the current page…">
      <button id="sendText" class="primary">Type</button>
      <button id="enterText">Enter</button>
    </section>

    <p class="hint">Tap the phone screen to click. Use the text box for keyboard input.</p>
  </main>

<script>
const screen = document.getElementById('screen');
const tapLayer = document.getElementById('tapLayer');
const loading = document.getElementById('loading');
const statusEl = document.getElementById('status');
const urlEl = document.getElementById('url');
const textEl = document.getElementById('text');
let busy = false;
const passwordEnabled = {{ 'true' if password_enabled else 'false' }};
let panelPassword = sessionStorage.getItem('panel_password') || '';

function setStatus(text, bad=false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('bad', bad);
}

function refreshScreen() {
  screen.src = '/api/screen?t=' + Date.now();
}

async function api(path, body, retry=true) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (passwordEnabled && panelPassword) headers['X-Panel-Password'] = panelPassword;
  const options = body === undefined ? {headers} : {method: 'POST', headers, body: JSON.stringify(body)};
  const res = await fetch(path, options);
  if (res.status === 401 && passwordEnabled && retry) {
    panelPassword = prompt('Panel password:') || '';
    sessionStorage.setItem('panel_password', panelPassword);
    return api(path, body, false);
  }
  const data = path === '/api/screen' ? null : await res.json();
  if (!res.ok || (data && data.ok === false)) throw new Error(data?.error || 'Request failed');
  return data;
}

async function updateState() {
  try {
    const data = await api('/api/state');
    urlEl.value = data.url || '';
    setStatus(data.title || 'Ready');
  } catch (e) {
    setStatus(e.message, true);
  }
}

async function runAction(name) {
  if (busy) return;
  busy = true;
  loading.classList.add('show');
  try {
    const data = await api('/api/action', {name});
    urlEl.value = data.url || '';
    setStatus(data.title || 'Ready');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    busy = false;
    loading.classList.remove('show');
    refreshScreen();
    setTimeout(updateState, 250);
  }
}

document.querySelectorAll('[data-action]').forEach(btn => {
  btn.addEventListener('click', () => runAction(btn.dataset.action));
});

document.getElementById('navForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;
  busy = true;
  loading.classList.add('show');
  setStatus('Opening…');
  try {
    const data = await api('/api/navigate', {url: urlEl.value});
    urlEl.value = data.url || '';
    setStatus(data.title || 'Ready');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    busy = false;
    loading.classList.remove('show');
    refreshScreen();
  }
});

tapLayer.addEventListener('click', async (e) => {
  const rect = screen.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (390 / rect.width);
  const y = (e.clientY - rect.top) * (844 / rect.height);
  try {
    await api('/api/tap', {x, y});
    setTimeout(refreshScreen, 100);
    setTimeout(updateState, 150);
  } catch (err) {
    setStatus(err.message, true);
  }
});

async function sendText(enter=false) {
  const value = textEl.value;
  if (!value && !enter) return;
  try {
    await api('/api/type', {text: value, enter});
    textEl.value = '';
    setTimeout(refreshScreen, 100);
  } catch (e) {
    setStatus(e.message, true);
  }
}

document.getElementById('sendText').addEventListener('click', () => sendText(false));
document.getElementById('enterText').addEventListener('click', () => sendText(true));
textEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendText(true); }
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Reset the browser session and cookies?')) return;
  try {
    const data = await api('/api/reset', {});
    urlEl.value = data.url || '';
    setStatus('Browser reset');
    refreshScreen();
  } catch (e) { setStatus(e.message, true); }
});

screen.addEventListener('load', () => loading.classList.remove('show'));
updateState();
refreshScreen();
setInterval(() => { if (!busy && document.visibilityState === 'visible') refreshScreen(); }, 1200);
</script>
</body>
</html>
